# Application Configuration
spring.application.name=tkvparking
server.port=8080

# MySQL DataSource Configuration (updated with better connection settings)
spring.datasource.url=jdbc:mysql://localhost:3306/tkvparking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Tanishq@tkv
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool settings (recommended for production)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=200000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway Configuration (if using database migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.web=INFO
logging.level.com.tanishqpark=DEBUG

# Server Configuration
server.connection-timeout=5000
server.servlet.session.timeout=30m

# Security Configuration (basic setup)
spring.security.user.name=admin
spring.security.user.password=admin@123
spring.security.user.roles=ADMIN

# Actuator Endpoints (for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


# for no reply email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tkvparking@gmail.com
spring.mail.password=pmgysepivdbrlyes
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
